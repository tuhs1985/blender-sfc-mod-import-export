schema: spec-driven

context: |
  Build a Blender add-on to import and export Starfleet Command MOD models.
  The supplied 3ds Max plugins document SFC2 behavior; support for other game
  versions must be established with evidence. The binary format is under
  investigation. Distinguish verified format behavior from hypotheses and
  runtime-capture observations. See docs/reverse-engineering.md and
  docs/remix-reference.md for evidence and fixture provenance. Game-derived
  fixtures and original third-party binaries stay local and out of Git unless
  redistribution is authorized. Do not apply the Remix adapter's UV correction
  to MOD data without direct evidence.

