schema: spec-driven

context: |
  Build a Blender add-on to import and export Starfleet Command: Orion Pirates
  MOD models. SFC3-specific features and workflows are out of scope unless
  explicitly requested.
  The supplied 3ds Max plugins document SFC2 behavior; support for other game
  versions must be established with evidence. The binary format is under
  investigation. Distinguish verified format behavior from hypotheses and
  runtime-capture observations. See docs/reverse-engineering.md and
  docs/remix-reference.md for evidence and fixture provenance. Game-derived
  fixtures and original third-party binaries stay local and out of Git unless
  redistribution is authorized. Do not apply the Remix adapter's UV correction
  to MOD data without direct evidence.
  Represent hardpoints and damage points as editable Blender empties, preserving
  the verified MOD data needed for export; do not assume Max dummy objects and
  Blender empties are structurally equivalent.
  The user confirmed that rotating the FCA preview +90 degrees about Blender's
  X axis gives the desired visual orientation. Apply the same transform to FCA
  geometry and markers; verify broader models and export round trips.
  Do not impose a BMP-only or game-specific texture-format restriction on
  importer or exporter assignments. Preserve user-selected references; the
  artist decides which textures to use. Actual in-game support is separate.

